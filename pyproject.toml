[project]
name = "ai-document-platform"
version = "0.1.0"
description = "Production-grade multi-tenant AI Document Intelligence SaaS"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- Web Framework ---
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",

    # --- Validation & Settings ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # --- Auth & Security ---
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",

    # --- AI / ML ---
    "sentence-transformers>=3.3.0",
    "chromadb>=0.6.0",
    "google-genai>=2.0.0",

    # --- Document Parsing ---
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",

    # --- Background Tasks ---
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # --- Storage ---
    "boto3>=1.35.0",
    "aiofiles>=24.1.0",

    # --- Observability ---
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # --- Utilities ---
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.4",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
